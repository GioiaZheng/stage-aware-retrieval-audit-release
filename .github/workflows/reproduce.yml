name: Full reproducibility check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: verification/requirements-usability.txt

      - name: Install verification dependency
        run: python -m pip install -r verification/requirements-usability.txt

      - name: Run clean public-input audit
        run: |
          python verification/run_usability_quickstart.py \
            --work-dir integration-work \
            --query scifact:13

      - name: Compare with retained reference
        run: cmp integration-work/quickstart-result.json verification/quickstart-reference.json

      - name: Run release-candidate invariants
        run: python -m unittest discover -s tests -v
